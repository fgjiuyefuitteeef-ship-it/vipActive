<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Page</title>

<script>
let page = 1;

function nextPage() {
    page++;

    if (page <= 5) {
        document.getElementById("title").innerText = "Step " + page + " / 5";
        startTimer();
    }

    if (page == 5) {
        document.getElementById("btn").innerText = "🎁 Claim Reward";
    }
}

function startTimer() {
    let time = 5;
    let t = setInterval(() => {
        document.getElementById("timer").innerText = time;
        time--;

        if (time < 0) {
            clearInterval(t);
            document.getElementById("btn").style.display = "block";
        }
    }, 1000);

    document.getElementById("btn").style.display = "none";
}

function clickBtn() {

    // हर page पर ad open
    window.open("https://www.profitablecpmratenetwork.com/qtaz118cip?key=bbcd12ff8e1634b45ff0af410987c8e0");

    if (page < 5) {
        nextPage();
    } else {
        // FINAL SUCCESS → APP KO SIGNAL
        window.location.href = "myapp://reward";
    }
}

window.onload = function () {
    startTimer();
}
</script>

</head>

<body style="text-align:center; font-family:sans-serif; padding-top:50px;">

<h2 id="title">Step 1 / 5</h2>

<p>⏳ Wait: <span id="timer">5</span> sec</p>

<button id="btn" onclick="clickBtn()" style="display:none; padding:15px 30px; font-size:16px;">
👉 Continue
</button>

</body>
</html>
