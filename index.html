<!DOCTYPE html>
<html>
<head>
<title>VIP Unlock</title>
<style>
body { background:#111; color:white; text-align:center; }
#locked { display:block; }
#unlocked { display:none; }
</style>
</head>

<body>

<div id="locked">
<h2>🔒 Locked</h2>
</div>

<div id="unlocked">
<h2>🎉 VIP PASS</h2>
<h1 id="pass">Loading...</h1>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

<script>
var firebaseConfig = {
  apiKey: "YOUR_KEY",
  databaseURL: "YOUR_DB_URL"
};

firebase.initializeApp(firebaseConfig);

let params = new URLSearchParams(location.search);
let id = params.get("id");
let token = params.get("token");

// ❌ Direct access block
if(document.referrer === "") {
    document.body.innerHTML = "❌ Access Denied";
}

// Cookie check
if(document.cookie.includes("vip_access=true")) {

    firebase.database().ref("videoPass/" + id).once("value")
    .then(snap => {

        let data = snap.val();

        if(data != null) {

            let now = Date.now()/1000;

            if(data.token == token && now < data.expiry) {

                // Unlock
                document.getElementById("locked").style.display = "none";
                document.getElementById("unlocked").style.display = "block";

                document.getElementById("pass").innerText = data.pass;

            } else {
                document.body.innerHTML = "❌ Invalid / Expired";
            }

        } else {
            document.body.innerHTML = "❌ No Data";
        }

    });

}
</script>

</body>
</html>
