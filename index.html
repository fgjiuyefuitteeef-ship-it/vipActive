#popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000000cc;
    display:none;
    justify-content:center;
    align-items:center;
}

.popupBox{

}

<script>
let page=1;
let scrolled=false;

// 🔒 Fake Adblock check
function detectAdBlock(){
    let ad = document.createElement("div");
    ad.innerHTML="&nbsp;";
    ad.className="adsbox";
    document.body.appendChild(ad);

    setTimeout(()=>{
        if(ad.offsetHeight==0){
            document.getElementById("popup").style.display="flex";
        }
        ad.remove();
    },100);
}

// ⏳ Timer
function startTimer(){
    let time=5;
    let t=setInterval(()=>{
        document.getElementById("timer").innerText=time;
        time--;

        if(time<0){
            clearInterval(t);
            checkUnlock();
        }
    },1000);
}

// 👇 Scroll check
function onScroll(){
    let el=document.getElementById("adArea");
    if(el.scrollTop + el.clientHeight >= el.scrollHeight){
        scrolled=true;
        checkUnlock();
    }
}

// ✅ Unlock button
function checkUnlock(){
    if(scrolled){
        document.getElementById("btn").style.display="block";
        document.getElementById("msg").innerText="👉 Continue";
    }else{
        document.getElementById("msg").innerText="⬇ Scroll down to continue";
    }
}

// 👉 Button click
function next(){
    window.open("https://www.profitablecpmratenetwork.com/qtaz118cip?key=bbcd12ff8e1634b45ff0af410987c8e0");

    if(page<5){
        page++;
        scrolled=false;
        document.getElementById("title").innerText="Step "+page+"/5";
        document.getElementById("btn").style.display="none";
        document.getElementById("adArea").scrollTop=0;
        startTimer();
    }else{
        window.location.href="myapp://reward";
    }
}

// 🔄 Refresh
function refreshPage(){
    location.reload();
}

window.onload=function(){
    detectAdBlock();
    startTimer();
}
</script>
