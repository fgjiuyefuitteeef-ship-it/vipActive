<!DOCTYPE html>
<html>
<head>
<title>VIP Unlock</title>

<style>
body {
    background: #0f172a;
    color: white;
    text-align: center;
    font-family: Arial;
}

#locked {
    display: block;
}

#unlocked {
    display: none;
}

.box {
    margin-top: 100px;
}
</style>

</head>
<body>

<div class="box">

<!-- Locked -->
<div id="locked">
    <h2>🔒 Section Locked</h2>
    <p>Please complete the process to unlock</p>
</div>

<!-- Unlocked -->
<div id="unlocked">
    <h2>🎉 VIP PASS</h2>
    <h1 id="pass">Loading...</h1>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

<script>

// 🔥 Firebase Config (Apna daalna)
var firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  databaseURL: "YOUR_DATABASE_URL"
};

firebase.initializeApp(firebaseConfig);

// 🔥 URL se Android ID lena
let params = new URLSearchParams(window.location.search);
let id = params.get("id");

// 🔥 Cookie check
if(document.cookie.includes("vip_access=true") && id != null) {

    // Unlock UI
    document.getElementById("locked").style.display = "none";
    document.getElementById("unlocked").style.display = "block";

    // Firebase se pass fetch
    firebase.database().ref("videoPass/" + id + "/pass").once("value")
    .then(snapshot => {
        let pass = snapshot.val();

        if(pass != null) {
            document.getElementById("pass").innerText = pass;
        } else {
            document.getElementById("pass").innerText = "No Pass Found ❌";
        }
    });

} else {
    // Locked hi rahega
}

</script>

</body>
</html>
