<script>
let page=1;
let scrolled=false;
let timerDone=false;

// ⏳ TIMER
function startTimer(){
    let time=5;

    let t=setInterval(()=>{
        document.getElementById("timer").innerText=time;
        time--;

        if(time < 0){
            clearInterval(t);
            timerDone=true;
            checkUnlock();
        }
    },1000);
}

// 📜 SCROLL (simple & guaranteed)
function onScroll(){
    scrolled=true;
    checkUnlock();
}

// 🔓 BUTTON SHOW
function checkUnlock(){
    if(scrolled && timerDone){
        let btn=document.getElementById("btn");
        btn.style.display="block";
        btn.innerText = (page==5) ? "🎁 Get Link" : "👉 Continue";
    }
}

// 👉 NEXT
function next(){

    // 🔥 Smart link open
    window.open("https://www.profitablecpmratenetwork.com/qtaz118cip?key=bbcd12ff8e1634b45ff0af410987c8e0");

    if(page < 5){
        page++;
        scrolled=false;
        timerDone=false;

        document.getElementById("title").innerText="SR Killer (Step "+page+"/5)";
        document.getElementById("btn").style.display="none";
        document.getElementById("adArea").scrollTop=0;

        startTimer();
    }else{
        // 🎁 FINAL REWARD
        window.location.href="myapp://reward";
    }
}

// START
window.onload=function(){
    startTimer();
}
</script>
