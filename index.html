<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR Killer</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#0f172a;
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

/* SCROLL AREA */
#adArea{
    height:75vh;
    overflow-y:auto;
    padding:10px;
}

/* ADS */
.adbox{
    margin:15px 0;
    text-align:center;
}

.adtext{
    font-size:12px;
    color:#aaa;
}

/* BUTTON */
#btn{
    width:100%;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    display:none;
    margin-top:20px;
}

/* REWARD PAGE */
#rewardPage{
    display:none;
    padding:20px;
    text-align:center;
}
</style>

<!-- POPUNDER -->
<script src="https://pl29111654.profitablecpmratenetwork.com/0a/da/53/0ada53cf1ee2fc328e4161f0372bf804.js"></script>

<!-- SMARTLINK -->
<script src="https://pl29111656.profitablecpmratenetwork.com/59/48/3d/59483df00ae33e125354988e11bf7959.js"></script>

</head>

<body>

<div id="mainPage">

<div class="header" id="title">SR Killer (Step 1/5)</div>

<center>
⏳ Wait: <span id="timer">5</span> sec  
<br><br>
⬇ Scroll down to continue
</center>

<div id="adArea" onscroll="onScroll()">

<!-- 🔥 15 BANNERS -->
<script>
for(let i=1;i<=15;i++){
document.write(`
<div class="adbox">
<script>
atOptions={'key':'4a8a25cd73058be8ffce6a94c4cd32d9','format':'iframe','height':250,'width':300};
<\/script>
<script src="https://www.highperformanceformat.com/4a8a25cd73058be8ffce6a94c4cd32d9/invoke.js"><\/script>
<p class="adtext">Advertisement ${i}</p>
</div>
`);
}
</script>

<!-- NATIVE -->
<div class="adbox">
<script async="async" data-cfasync="false" src="https://pl29111657.profitablecpmratenetwork.com/54426d319c08a1ac0383777873cb1ed5/invoke.js"></script>
<div id="container-54426d319c08a1ac0383777873cb1ed5"></div>
</div>

<button id="btn" onclick="next()">👉 Continue</button>

</div>
</div>

<!-- 🎁 REWARD PAGE -->
<div id="rewardPage">
<h2>🎉 Reward Unlocked</h2>

<p>Your Secret Key:</p>

<div id="keyBox" style="
background:#1e293b;
padding:15px;
border-radius:10px;
font-size:18px;
margin:20px 0;
word-break:break-all;"></div>

<button onclick="copyKey()" style="
padding:12px 20px;
background:#22c55e;
border:none;
color:white;
border-radius:8px;
font-size:16px;">
📋 Copy Key
</button>

<p style="margin-top:20px; font-size:12px; color:#aaa;">
Save this key safely
</p>
</div>

<script>
let page=1;
let scrolled=false;
let timerDone=false;

/* TIMER */
function startTimer(){
    let time=5;
    let t=setInterval(()=>{
        document.getElementById("timer").innerText=time;
        time--;

        if(time<0){
            clearInterval(t);
            timerDone=true;
            checkUnlock();
        }
    },1000);
}

/* SCROLL */
function onScroll(){
    let el=document.getElementById("adArea");

    if(el.scrollTop + el.clientHeight >= el.scrollHeight - 50){
        scrolled=true;
        checkUnlock();
    }
}

/* BUTTON SHOW */
function checkUnlock(){
    if(scrolled && timerDone){
        let btn=document.getElementById("btn");
        btn.style.display="block";
        btn.innerText=(page==5) ? "🎁 Get Reward" : "👉 Continue";
    }
}

/* NEXT PAGE */
function next(){

    window.open("https://www.profitablecpmratenetwork.com/qtaz118cip?key=bbcd12ff8e1634b45ff0af410987c8e0");

    if(page<5){
        page++;
        scrolled=false;
        timerDone=false;

        document.getElementById("title").innerText="SR Killer (Step "+page+"/5)";
        document.getElementById("btn").style.display="none";
        document.getElementById("adArea").scrollTop=0;

        startTimer();
    }else{
        showReward();
    }
}

/* 🔐 KEY GENERATE */
function generateKey(){
    return 'SR-' + Math.random().toString(36).substring(2,10).toUpperCase();
}

/* COPY */
function copyKey(){
    let text=document.getElementById("keyBox").innerText;
    navigator.clipboard.writeText(text);
    alert("Key Copied!");
}

/* FIREBASE SAVE */
function saveToFirebase(key){
    let url="https://notecloudapp-7e53d-default-rtdb.firebaseio.com/Reword/"+key+"/"+key+".json";

    fetch(url,{
        method:"PUT",
        body: JSON.stringify({
            key:key,
            time:Date.now()
        })
    });
}

/* SHOW REWARD */
function showReward(){

    document.getElementById("mainPage").style.display="none";
    document.getElementById("rewardPage").style.display="block";

    let key=generateKey();
    document.getElementById("keyBox").innerText=key;

    saveToFirebase(key);
}

window.onload=function(){
    startTimer();
}
</script>

</body>
</html>
