<script>
let page=1;
let scrolled=false;
let timerDone=false;

// ⏳ TIMER
function startTimer(){
    let time=5;
    timerDone=false;

    let t=setInterval(()=>{
        document.getElementById("timer").innerText=time;
        time--;

        if(time<0){
            clearInterval(t);
            timerDone=true;
            checkUnlock();
        }
    },1000);
}

// 📜 SCROLL
function onScroll(){
    let el=document.getElementById("adArea");
    if(el.scrollTop + el.clientHeight >= el.scrollHeight){
        scrolled=true;
        checkUnlock();
    }
}

// 🔓 UNLOCK BUTTON
function checkUnlock(){
    if(scrolled && timerDone){
        let btn=document.getElementById("btn");
        btn.style.display="block";
        btn.innerText = (page==5) ? "🎁 Get Link" : "👉 Continue";
    }
}

// ✅ CHECK ADS ONLY ON CLICK
function checkAdsBeforeNext(){

    let adLoaded=false;

    let container=document.getElementById("container-54426d319c08a1ac0383777873cb1ed5");

    if(container && container.innerHTML.trim().length > 50){
        adLoaded=true;
    }

    let iframes=document.getElementsByTagName("iframe");
    if(iframes.length > 1){
        adLoaded=true;
    }

    if(!adLoaded){
        document.getElementById("popup").style.display="flex";
        return false;
    }

    return true;
}

// 👉 NEXT
function next(){

    // पहले ad check
    if(!checkAdsBeforeNext()){
        return;
    }

    window.open("https://www.profitablecpmratenetwork.com/qtaz118cip?key=bbcd12ff8e1634b45ff0af410987c8e0");

    if(page<5){
        page++;
        scrolled=false;
        timerDone=false;

        document.getElementById("title").innerText="SR Killer (Step "+page+"/5)";
        document.getElementById("btn").style.display="none";
        document.getElementById("adArea").scrollTop=0;

        startTimer();
    }else{
        window.location.href="myapp://reward";
    }
}

// 🔄 REFRESH
function refreshPage(){
    location.reload();
}

window.onload=function(){
    startTimer();
}
</script>
