<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Activated!</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff7e5f, #feb47b);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vip-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        animation: pop 0.5s ease-out forwards;
    }

    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .vip-card h1 {
        color: #f39c12;
        font-size: 28px;
        margin-bottom: 10px;
    }

    .vip-card p {
        color: #333;
        font-size: 18px;
        margin-bottom: 20px;
    }

    .vip-card .icon {
        font-size: 50px;
        color: #f39c12;
        margin-bottom: 20px;
    }

    .vip-card button {
        background: linear-gradient(90deg, #f39c12, #e67e22);
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
    }

    .vip-card button:hover {
        transform: scale(1.05);
        background: linear-gradient(90deg, #e67e22, #f39c12);
    }
</style>
</head>
<body>

<div class="vip-card">
    <div class="icon">🎉</div>
    <h1>Congratulations!</h1>
    <p>Your VIP is now <strong>Active for 24 Hours</strong></p>
    <button onclick="alert('Enjoy your VIP access!')">Enjoy VIP</button>
</div>

</body>
</html>
