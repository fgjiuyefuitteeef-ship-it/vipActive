<script>
let params = new URLSearchParams(location.search);
let id = params.get("id");
let token = params.get("token");

// Cookie set (short time)
document.cookie = "vip_access=true; max-age=120; path=/";

// Redirect to main page
window.location.href = "index.html?id=" + id + "&token=" + token;
</script>
